<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tangos 1 — Pieza de live coding · Salvador Cassis</title>
  <meta name="description" content="Tangos 1: los «tangos» son un palo del flamenco, aquí recreados en tiempo real con código (Strudel). Escucha la pieza y ve al mismo tiempo el código que la genera.">
  <meta property="og:title" content="Tangos 1 — Pieza de live coding · Salvador Cassis">
  <meta property="og:description" content="Los «tangos» son un palo del flamenco, aquí recreados en tiempo real con código. Escucha la pieza y ve el código que la genera.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://salvadorcassis.com/lab/piezas/tangos-1/">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://salvadorcassis.com/lab/piezas/tangos-1/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Strichpunkt+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #1A1A12;
      --surface: #252518;
      --text:    #E8DEC8;
      --muted:   rgba(232, 222, 200, 0.6);
      --accent:  #C47A50;
      --border:  #3E4A28;
      --display: 'Strichpunkt Sans', system-ui, sans-serif;
      --mono:    'Space Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--display);
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 0;
    }

    .piece-header { flex-shrink: 0; }

    .back {
      display: inline-block;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.2s ease;
    }

    .back:hover,
    .back:focus-visible { color: var(--accent); }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0.6rem 0 1rem;
    }

    .context {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--muted);
      max-width: 60ch;
      margin-bottom: 1.5rem;
    }

    /* Reproductor: embebe bare.html (única fuente de la pieza) */
    .piece-player {
      flex: 1;
      min-height: 60vh;
      border: 1.5px solid var(--border);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }

    .piece-player iframe {
      width: 100%;
      height: 100%;
      min-height: inherit;
      border: none;
      display: block;
    }

    @media (min-width: 768px) {
      .page { padding-top: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="piece-header">
      <a class="back" href="/lab/">← Caja de herramientas</a>
      <h1>Tangos 1</h1>
      <p class="meta">Flamenco · Live coding · feb. 2026</p>
      <p class="context">
        Los «tangos» son un palo del flamenco. Esta es una versión generada en
        tiempo real con código: toca para escuchar la pieza y ver, al mismo tiempo,
        el código que la crea. Puedes modificarlo y experimentar.
      </p>
    </header>

    <main class="piece-player">
      <iframe src="./bare.html" title="Reproductor de Tangos 1" allow="autoplay"></iframe>
    </main>
  </div>
</body>
</html>
