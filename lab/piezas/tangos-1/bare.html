<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tangos 1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1A1A12; }

    .wrap {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .strudel-container {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 18, 0.92);
      cursor: pointer;
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
      font-family: system-ui, sans-serif;
      transition: opacity 0.3s ease;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(232, 222, 200, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #E8DEC8;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .play-overlay:hover .play-icon {
      border-color: #C47A50;
      background-color: rgba(196, 122, 80, 0.15);
    }

    .play-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: #E8DEC8;
    }

    .play-hint {
      font-size: 0.82rem;
      color: rgba(232, 222, 200, 0.5);
      max-width: 28ch;
      line-height: 1.6;
    }
  </style>
</head>

        <p class="play-label">Toca para escuchar</p>
        <p class="play-hint">Puedes modificar el código y presionar Ctrl+Enter para experimentar.</p>

    </div>
  </div>
