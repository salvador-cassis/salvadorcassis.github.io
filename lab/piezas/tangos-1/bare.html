<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tangos 1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #1A1A12; }

    .wrap {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .strudel-container {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 18, 0.92);
      gap: 1.25rem;
      text-align: center;
      padding: 2rem;
      font-family: system-ui, sans-serif;
      transition: opacity 0.3s ease;
    }

    /* Estados del overlay: solo uno visible según data-state */
    .ov-state { display: none; flex-direction: column; align-items: center; gap: 1.1rem; }
    .play-overlay[data-state="initial"] { cursor: pointer; }
    .play-overlay[data-state="initial"] .ov-initial { display: flex; }
    .play-overlay[data-state="loading"] .ov-loading { display: flex; }
    .play-overlay[data-state="error"]   .ov-error   { display: flex; }

    /* Estado "done": el overlay se aparta y deja pasar el clic al iframe */
    .play-overlay[data-state="done"] {
      opacity: 0;
      pointer-events: none;
    }

    .play-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(232, 222, 200, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #E8DEC8;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .play-overlay[data-state="initial"]:hover .play-icon {
      border-color: #C47A50;
      background-color: rgba(196, 122, 80, 0.15);
    }

    .play-label {
      font-size: 1.05rem;
      font-weight: 600;
      color: #E8DEC8;
    }

    .play-hint {
      font-size: 0.82rem;
      color: rgba(232, 222, 200, 0.5);
      max-width: 30ch;
      line-height: 1.6;
    }

    /* Spinner de carga */
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(232, 222, 200, 0.2);
      border-top-color: #C47A50;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(232, 222, 200, 0.2); }
    }

    /* Acciones del estado de error */
    .ov-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }

    .ov-link, .ov-retry {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid #C47A50;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .ov-link { color: #E8DEC8; background: transparent; }
    .ov-link:hover { background: rgba(196, 122, 80, 0.15); }

    .ov-retry { color: #1A1A12; background: #C47A50; }
    .ov-retry:hover { background: #d88a5e; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="strudel-container">
      <iframe id="strudel-frame" src="" allow="autoplay" title="Tangos 1 — Live coding"></iframe>

      <div class="play-overlay" id="play-overlay" data-state="initial">
        <!-- Estado inicial -->
        <div class="ov-state ov-initial">
          <div class="play-icon">▶</div>
          <p class="play-label">Toca para escuchar</p>
          <p class="play-hint">Se abre un reproductor de código musical en vivo. Puede tardar unos segundos.</p>
        </div>

        <!-- Estado cargando -->
        <div class="ov-state ov-loading">
          <div class="spinner" role="status" aria-label="Cargando el reproductor"></div>
          <p class="play-label">Cargando el reproductor…</p>
        </div>

        <!-- Estado error -->
        <div class="ov-state ov-error">
          <p class="play-label">No se pudo cargar el reproductor</p>
          <p class="play-hint">Puede que tu conexión esté bloqueando el servicio de sonido.</p>
          <div class="ov-actions">
            <button type="button" class="ov-retry" id="ov-retry">Reintentar</button>
            <a class="ov-link" id="ov-fallback" href="#" target="_blank" rel="noopener noreferrer">Abrir en strudel.cc ↗</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const overlay  = document.getElementById('play-overlay');
    const frame    = document.getElementById('strudel-frame');
    const retry    = document.getElementById('ov-retry');
    const fallback = document.getElementById('ov-fallback');

    const src = "https://strudel.cc/#Ly8gIlRBTkdPUyAxIiBAYnkgU2FsdmFkb3JDYXNzaXMKCnNldGNwbSg4MC80KQpsZXQgY2hvcmRzID0gY2hvcmQoIjxbQW05IEFtN11HYWRkOSBbRiBbRjYgRjddXSBbRTdiOSBbRXN1cyBFN11dPi8yIikuZGljdCgnaXJlYWwnKQoKc3RhY2soIAogIHN0YWNrKCAvLyBSSVRNTwogIHMoImNwOjMiKS5zdHJ1Y3QoIn4gfiB4IH4geCB%2BIHggfiB%2BIHggeCB4IHggfiB4IH4iKSwKICBzKCJjcDo1Iikuc3RydWN0KCJ%2BIHggfiB4IH4geCB%2BIHgiKSwKICBzKCJkYXJidWthIikuc3RydWN0KCJ%2BIH4gfiB4IH4gfiB4IH4gfiB%2BIH4geCB%2BIH4geCB%2BIiksCiAgcygiY2Fqb24iKS5zdHJ1Y3QoInggfiB4IHggfiB%2BIHggfiB%2BIH4geCB4IH4gfiB4IH4iKQogICAgICAgICkKCiAgLm1hc2soIjxbMCAxXSAxIDEgMT4vMTYiLmVhcmx5KC41KSksIAogIAogIHN0YWNrKCAvLyBBUk1PTklBCiAgY2hvcmRzLm9mZnNldCgtMSkudm9pY2luZygpLnMoImdtX2VwaWFubzE6MSIpCiAgLnBoYXNlcig0KS5yb29tKC41KSkKICAp";

    fallback.href = src;

    let started = false;
    let timer = null;

    function start() {
      started = true;
      overlay.dataset.state = 'loading';
      frame.src = src;
      clearTimeout(timer);
      // Si el iframe no reporta carga en 12s, ofrecer reintento / enlace directo
      timer = setTimeout(() => {
        if (overlay.dataset.state === 'loading') overlay.dataset.state = 'error';
      }, 12000);
    }

    // 'load' se dispara cuando strudel.cc entrega su documento (aunque no podamos
    // inspeccionarlo por ser cross-origin). Es señal suficiente para retirar el overlay.
    frame.addEventListener('load', () => {
      if (!started) return;               // ignora la carga inicial con src vacío
      clearTimeout(timer);
      overlay.dataset.state = 'done';
    });

    // Solo el estado inicial arranca al tocar el fondo del overlay.
    overlay.addEventListener('click', () => {
      if (overlay.dataset.state === 'initial') start();
    });

    retry.addEventListener('click', (e) => { e.stopPropagation(); start(); });
  </script>
</body>
</html>
